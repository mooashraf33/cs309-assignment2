<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Simple Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="container">
            <a href="index.html">Simple Site</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Contact Us</h1>
        <p>Fill in the form to practice common HTML form controls.</p>

        <form action="#" method="get">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="number">Number</label>
                <input type="number" id="number" name="number">
            </div>
            <div>
                <label for="date">Date</label>
                <input type="date" id="date" name="date">
            </div>

            <fieldset>
                <legend>Preferred contact method</legend>
                <div class="choice">
                    <input type="radio" id="contact-email" name="contact-method" value="email">
                    <label for="contact-email">Email</label>
                </div>
                <div class="choice">
                    <input type="radio" id="contact-phone" name="contact-method" value="phone">
                    <label for="contact-phone">Phone</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Topics of interest</legend>
                <div class="choice">
                    <input type="checkbox" id="topic-html" name="topics" value="html">
                    <label for="topic-html">HTML</label>
                </div>
                <div class="choice">
                    <input type="checkbox" id="topic-css" name="topics" value="css">
                    <label for="topic-css">CSS</label>
                </div>
            </fieldset>

            <div>
                <label for="subject">Subject</label>
                <select id="subject" name="subject">
                    <option value="">Choose a subject</option>
                    <option value="question">Question</option>
                    <option value="feedback">Feedback</option>
                </select>
            </div>
            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>
            </div>
            <button class="button" type="submit">Submit message</button>
        </form>

        <div class="alert alert-error">
            <p><strong>Example error:</strong> This alert demonstrates an error message style.</p>
        </div>
    </main>

    <footer>
    </footer>
</body>
</html>
